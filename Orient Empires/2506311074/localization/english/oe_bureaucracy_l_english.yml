 game_concept_BureaucracyEmpire_bureaucracy_exp_rank_desc: "The ranking of the official among all officials with the same [bureaucracy_title_rank|E]; the higher the ranking, the more the official will be prioritized for promotion in the event of a vacancy in a [bureaucracy_title_rank|E] higher [title|E]."
 bureaucracy_title_rank: "[bureaucracy_title_rank|E]"
 game_concept_bureaucracy_title_rank: "Bureaucracy Title Rank"
 game_concept_bureaucracy_title_rank_desc: "Bureaucracy Title Rank divides [title|E] into seven classes based on knighthood, capital development, and distance to the Imperial capital.\nThe five tendencies of [lifestyle_bureaucrat|E] are matched one-to-one with the first five ranks of [title|E], and officials whose [lifestyle_bureaucrat|E] does not match the [bureaucracy_title_rank|E] will be moved to a matching position.\n\nBureaucracy Title Rank are:\n$EFFECT_LIST_BULLET$[bureaucracy_title_rank_1|E]\n$EFFECT_LIST_BULLET$[bureaucracy_title_rank_2|E]\n$EFFECT_LIST_BULLET$[bureaucracy_title_rank_3|E]\n$EFFECT_LIST_BULLET$[bureaucracy_title_rank_4|E]\n$EFFECT_LIST_BULLET$[bureaucracy_title_rank_5|E]\n$EFFECT_LIST_BULLET$[bureaucracy_title_rank_6|E]\n$EFFECT_LIST_BULLET$[bureaucracy_title_rank_7|E]"

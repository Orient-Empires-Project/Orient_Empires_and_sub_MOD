 BureaucracyEmpire_bureaucrat_exp: "[BureaucracyEmpire_bureaucrat_exp|E]"
 trait_BureaucracyEmpire_bureaucrat_1: "Newcomers"
 trait_BureaucracyEmpire_bureaucrat_1_desc: "This character is learning how to handle official documents and familiarize with the rules of the officialdom.\n\nOnly Officials with [official_succession_law|E], aka Non-hereditary Officials, can hold [lifestyle_bureaucrat|E], which represents the Rank of the official and is retained on [title|E] lost. An Official with a higher Rank will be assigned more important [title|E] posts.\nBureaucrat Rank level 3 or higher can serve in [duchy|E], level 2 or higher can serve in [count|E], or they will be demoted. One with a well-known [crime|E] or mental illness will get their [trait_level_track_xp|E] cleared. One who disobeys Gender Law or is over 70 years old will be [depose|E].\n\nAny [trait_level_track|E] upgrade will raise their Bureaucrat Rank."
 trait_BureaucracyEmpire_bureaucrat_2: "Talented Newcomers"
 trait_BureaucracyEmpire_bureaucrat_2_desc: "This character has emerged in the official career and is full of ambitions.\n\n[lifestyle_bureaucrat|E] is only available for Officials with [official_succession_law|E], which are Non-hereditary Officials. It represents the level and salary of Officials, and will be reserved even without [title|E]. Officials with higher Bureaucrat Rank will be assigned to more important [title|E] actual jobs.\n3 or higher Bureaucrat Rank can be assigned to [duchy|E], 2 or higher Bureaucrat Rank can be assigned to [count|E], else will be demoted. Having a well-known [crime|E] or mental illness will cause a reset on [trait_level_track_xp|E]. Violating Gender Law or age over 70 will cause [depose|E].\n\nAny leveling up of [trait_level_track|E] will lead to Bureaucrat Rank up."
 trait_BureaucracyEmpire_bureaucrat_3: "Officialdom Slicker"
 trait_BureaucracyEmpire_bureaucrat_3_desc: "The character has been through a lot and has become know about the ways of the world.  able to make mature compromises and benefit exchanges.\n\n[lifestyle_bureaucrat|E] is only available for Officials with [official_succession_law|E], which are Non-hereditary Officials. It represents the level and salary of Officials, and will be reserved even without [title|E]. Officials with higher Bureaucrat Rank will be assigned to more important [title|E] actual jobs.\n3 or higher Bureaucrat Rank can be assigned to [duchy|E], 2 or higher Bureaucrat Rank can be assigned to [count|E], else will be demoted. Having a well-known [crime|E] or mental illness will cause a reset on [trait_level_track_xp|E]. Violating Gender Law or age over 70 will cause [depose|E].\n\nAny leveling up of [trait_level_track|E] will lead to Bureaucrat Rank up."
 trait_BureaucracyEmpire_bureaucrat_4: "Experienced Holder"
 trait_BureaucracyEmpire_bureaucrat_4_desc: "The role can deal with ever-changing situations and make astute decisions based on experience.\n\n[lifestyle_bureaucrat|E] is only available for Officials with [official_succession_law|E], which are Non-hereditary Officials. It represents the level and salary of Officials, and will be reserved even without [title|E]. Officials with higher Bureaucrat Rank will be assigned to more important [title|E] actual jobs.\n3 or higher Bureaucrat Rank can be assigned to [duchy|E], 2 or higher Bureaucrat Rank can be assigned to [count|E], else will be demoted. Having a well-known [crime|E] or mental illness will cause a reset on [trait_level_track_xp|E]. Violating Gender Law or age over 70 will cause [depose|E].\n\nAny leveling up of [trait_level_track|E] will lead to Bureaucrat Rank up."
 trait_BureaucracyEmpire_bureaucrat_5: "Durable Politician"
 trait_BureaucracyEmpire_bureaucrat_5_desc: "The character has spent decades in officialdom and is capable of having a profound impact on the future destiny of the country.\n\n[lifestyle_bureaucrat|E] is only available for Officials with [official_succession_law|E], which are Non-hereditary Officials. It represents the level and salary of Officials, and will be reserved even without [title|E]. Officials with higher Bureaucrat Rank will be assigned to more important [title|E] actual jobs.\n3 or higher Bureaucrat Rank can be assigned to [duchy|E], 2 or higher Bureaucrat Rank can be assigned to [count|E], else will be demoted. Having a well-known [crime|E] or mental illness will cause a reset on [trait_level_track_xp|E]. Violating Gender Law or age over 70 will cause [depose|E].\n\nAny leveling up of [trait_level_track|E] will lead to Bureaucrat Rank up."
 trait_BureaucracyEmpire_bureaucrat_6: "Excellent Chancellor"
 trait_BureaucracyEmpire_bureaucrat_6_desc: "The character has spent decades in officialdom and is capable of having a profound impact on the future destiny of the country.\n\n[lifestyle_bureaucrat|E] is only available for Officials with [official_succession_law|E], which are Non-hereditary Officials. It represents the level and salary of Officials, and will be reserved even without [title|E]. Officials with higher Bureaucrat Rank will be assigned to more important [title|E] actual jobs.\n3 or higher Bureaucrat Rank can be assigned to [duchy|E], 2 or higher Bureaucrat Rank can be assigned to [count|E], else will be demoted. Having a well-known [crime|E] or mental illness will cause a reset on [trait_level_track_xp|E]. Violating Gender Law or age over 70 will cause [depose|E].\n\nAny leveling up of [trait_level_track|E] will lead to Bureaucrat Rank up."
 trait_BureaucracyEmpire_bureaucrat_7: "King Maker"
 trait_BureaucracyEmpire_bureaucrat_7_desc: "The character has spent decades in officialdom and is capable of having a profound impact on the future destiny of the country.\n\n[lifestyle_bureaucrat|E] is only available for Officials with [official_succession_law|E], which are Non-hereditary Officials. It represents the level and salary of Officials, and will be reserved even without [title|E]. Officials with higher Bureaucrat Rank will be assigned to more important [title|E] actual jobs.\n3 or higher Bureaucrat Rank can be assigned to [duchy|E], 2 or higher Bureaucrat Rank can be assigned to [count|E], else will be demoted. Having a well-known [crime|E] or mental illness will cause a reset on [trait_level_track_xp|E]. Violating Gender Law or age over 70 will cause [depose|E].\n\nAny leveling up of [trait_level_track|E] will lead to Bureaucrat Rank up."

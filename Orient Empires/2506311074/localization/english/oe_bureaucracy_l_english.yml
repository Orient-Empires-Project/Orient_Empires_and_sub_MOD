 trait_track_accomplishments: "Accomplishments"
 trait_track_accomplishments_desc: "Upgrading [trait_level_track_xp|E] requires building [realm_capital|E][building|E], upgrading [county|E][development|E], upgrading [realm_capital|E][county_opinion|E], help [liege|E] win [war|E], [acclaimed_knight|E] to gain [glory|E], and gain [title|E] with a high [stewardship_lifestyle|E] [perk|E]   \nAccomplishments[trait_level_track|E]will increase boost the greed in [character_personality|E]"
 trait_track_seniority: "Seniority"
 trait_track_seniority_desc: "Raising the [trait_level_track_xp|E] requires participating in [travel|E], performing a court [scheme|E], geting or using a [hook|E], becoming a [house_head|E], and obtaining [title|E] with a higher [dynasty_prestige_level|E].\nOnce [crime|E] is exposed, [trait_level_track_xp|E] will be cleared. \n[trait_level_track|E] will raise the rationality in [character_personality|E]"

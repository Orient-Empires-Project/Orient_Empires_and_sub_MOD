 game_concept_bureaucrat_successor_desc: "An Alternate Official is an officer who is prepared to take office after this [title|e] vacancy.\nOfficials adopt the [official_succession_law|E] Succession Law, whereby officials with different [lifestyle_bureaucrat|E] will be appointed to [title|e] positions of different grades, and those with the same [lifestyle_bureaucrat|E] will be given priority in the appointment of those with a higher [BureaucracyEmpire_bureaucrat_exp|E]."

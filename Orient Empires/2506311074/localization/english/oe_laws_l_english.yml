l_english:
 game_concept_celestial_authority: "Celestial Authority"
 game_concept_celestial_authority_desc: "$game_concept_celestial_authority$代表了[administrative|E][realms|E]的集权等级，以及[ruler|E]对[vassals|E]的一般权力。\n\n只有[top_liege|E]可以更改$game_concept_celestial_authority$。行政制$game_concept_vassals$使用与$game_concept_liege$同等级的官僚体制。\n\n共有四级$game_concept_celestial_authority$：\n$EFFECT_LIST_BULLET$$celestial_authority_0$\n$EFFECT_LIST_BULLET$$celestial_authority_1$\n$EFFECT_LIST_BULLET$$celestial_authority_2$\n$EFFECT_LIST_BULLET$$celestial_authority_3$\n\n提高$game_concept_celestial_authority$需要花费一定的[prestige|E]，具体取决于[realm_size|E]和统治者的[learning_skill|E]。"


 celestial_authority: "[celestial_authority|E]"
 celestial_authority_singular: "[celestial_authority|E]"
 celestial_authority_0: "Decentralized Realm"
 celestial_authority_0_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 Vassals' [titles|E] cannot be inherited by Characters outside the [realm|E]#!"
 celestial_authority_1: "Limited Administration"
 celestial_authority_1_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 Rulers can change between available Partition [succession_laws|E]#!\n$EFFECT_LIST_BULLET$[titles|E] can be revoked\n$EFFECT_LIST_BULLET$[vassals|E] can be retracted"
 celestial_authority_1_effects_not_in_prev: "$EFFECT_LIST_BULLET$#indent_newline:3 Non-[administrative|E] [vassals|E] cannot wage [war|E] against other Vassals unless they use a [hook|E] on their [liege|E]#!"
 celestial_authority_2: "Centralized Bureaucracy"
 celestial_authority_2_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 Rulers can change between all available [succession_laws|E]#!\n$EFFECT_LIST_BULLET$#indent_newline:3 All Vassals who refuse Title revocation or Vassal retraction are considered [criminals|E]#!\n$EFFECT_LIST_BULLET$#high $demand_admin_interaction$#! cost is reduced"
 celestial_authority_2_effects_not_in_prev: "$EFFECT_LIST_BULLET$#indent_newline:3 Cost for [liege|E] to call upon [provincial_armies|E]: [influence_i|E]#P -[EmptyScope.ScriptValue('admin_law_cost_reduction_value')|+0%]#!#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Non-[administrative|E] [vassals|E] cannot wage any [war|E] unless they use a [hook|E] on their [liege|E]#!"
 celestial_authority_3: "Absolute Autocracy"
 celestial_authority_3_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 Cost for [liege|E] to call upon [provincial_armies|E]: [influence_i|E]#P -[EmptyScope.ScriptValue('admin_law_cost_reduction_high_value')|+0%]#!#!"
 celestial_authority_3_effects_not_in_prev: "$EFFECT_LIST_BULLET$#indent_newline:3 Non-[administrative|E] [vassals|E] can never declare [war|E]#!"


 can_demand_celestial_government: "[celestial_authority|E]允许要求转为律令制"
 can_designate_bureaucracy_successor: "[celestial_authority|E]允许指定述任官僚"
 liege_can_designate_bureaucracy_successor: "[celestial_authority|E]允许[GetTitleByKey('e_minister_chancellor').GetHolder.GetShortUIName]指定述任官僚"
 can_set_bureaucratic_term: "[celestial_authority|E]允许重设官僚任期"
 change_title_contract: "[celestial_authority|E]允许无限制指定律令类型"
 can_replace_the_bureaucrat: "[celestial_authority|E]允许替换官员"
 liege_can_replace_the_bureaucrat: "[celestial_authority|E]允许[GetTitleByKey('e_minister_grand_marshal').GetName]替换官员"
 can_exchange_two_bannermen: "[celestial_authority|E]允许调换军事官员防区"
 can_grant_titular_title: "[celestial_authority|E]允许授予荣誉头衔"
 
 NOT_can_demand_celestial_government: "当前[celestial_authority|E]不允许要求转为律令制"
 NOT_can_designate_bureaucracy_successor: "当前[celestial_authority|E]不允许指定述任官僚"
 NOT_liege_can_designate_bureaucracy_successor: "当前[liege|E][celestial_authority|E]不允许指定述任官僚"
 NOT_can_set_bureaucratic_term: "当前[celestial_authority|E]不允许重设官僚任期"
 NOT_change_title_contract: "当前[celestial_authority|E]不允许无限制指定律令类型"
 NOT_can_replace_the_bureaucrat: "当前[celestial_authority|E]不允许替换官员"
 NOT_liege_can_replace_the_bureaucrat: "当前[liege|E][celestial_authority|E]不允许替换官员"
 NOT_can_exchange_two_bannermen: "当前[celestial_authority|E]不允许调换军事官员防区"
 NOT_can_grant_titular_title: "当前[celestial_authority|E]不允许授予荣誉头衔"



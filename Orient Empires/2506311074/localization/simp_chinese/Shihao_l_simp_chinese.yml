 #补充谥号描述
 shihao_gaozu_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 覆帱同天，克有天下，谥曰神尧大圣大光孝\n\n贞观九年（635）病逝，初谥太武皇帝（一作“大武皇帝”），高宗上元元年（674），改谥神尧皇帝，玄宗天宝八载，改谥神尧大圣皇帝。天宝十三载（752）， 增谥为神尧大圣大光孝皇帝。"                                                                  
 shihao_taizu_song_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 德覆万物，以法正国，谥曰启运立极英武睿文神德圣功至明大孝\n\n初谥英武圣文神德皇帝。大中祥符元年（1008）定谥为启运立极英武睿文神德圣功至明大孝皇帝"
 shihao_taizong_song_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 慈惠爱民，昭德有劳，谥曰至仁应道神功圣德文武睿烈大明广孝\n\n初谥神功圣德文武皇帝，后累加谥为“至仁应运神功圣德文武睿烈大明广孝皇帝”"
 shihao_yang_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 好内远礼，肆行劳神，谥曰炀！"
 shihao_shang_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 在国遭忧，短折不成，谥曰殇！"
 

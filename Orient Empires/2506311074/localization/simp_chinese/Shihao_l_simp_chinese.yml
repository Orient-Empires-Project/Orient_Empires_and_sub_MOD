 shihao_xianzong1_yuan: "桓肃"
 shihao_shizu_yuan: "薛禅汗、圣德神功文武"
 shihao_yuzong_yuan: "文惠明孝"
 shihao_chengzong_yuan: "完泽笃汗、钦明广孝"
 shihao_shunzong_yuan: "昭圣衍孝"
 shihao_wuzong_yuan: "曲律汗、仁惠宣孝"
 shihao_renzong_yuan: "普颜笃汗、圣文钦孝"
 shihao_yingzong_yuan: "格坚汗、睿圣文孝"
 shihao_xianzong_yuan: "光圣仁孝"
 shihao_wenzong_yuan: "札牙笃汗、圣明元孝"
 shihao_mingzong_yuan: "忽都笃汗、翼献景孝"
 shihao_ningzong_yuan: "冲圣嗣孝"
 shihao_huizong_yuan: "乌哈笃汗、顺"
 
 shihao_liezu_yuan_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 安仁立政，主义行德，谥曰神元\n\n（元世祖追谥为神元皇帝，庙号烈祖）"
 shihao_taizu_yuan_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 覆帱同天，克有天下，尊号“成吉思汗”，谥曰法天启运圣武\n\n（元世祖追谥为圣武皇帝，庙号太祖。元武宗增谥为法天启运圣武皇帝。）"
 shihao_ruizong_yuan_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 业成无兢，克定祸乱，被尊称“也可那颜”，谥曰仁圣景襄\n\n（蒙哥汗追谥为英武皇帝。元世祖改谥景襄皇帝，庙号睿宗。元武宗增谥为仁圣景襄皇帝）"
 shihao_taizong_yuan_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 明识大略，经纬天地，尊号“木亦坚汗”，谥曰英文\n\n（元世祖追谥）"
 shihao_dingzong_yuan_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 至德临下，布纲治纪，谥曰简平\n\n（元世祖追谥）"
 shihao_xianzong1_yuan_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 武定四方，身正人服，谥曰桓肃\n\n（元世祖追谥）"
 shihao_shizu_yuan_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 经纬天地，德覆万物，尊号“薛禅汗”，谥曰圣德神功文武"
 shihao_yuzong_yuan_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 宽仁得众，仁惠克广，谥曰文惠明孝\n\n（元成宗追谥）"
 shihao_chengzong_yuan_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 安民立政，内德纯备，尊号“完泽笃汗”，谥曰钦明广孝"
 shihao_shunzong_yuan_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 慈和遍服，德容如玉，谥曰昭圣衍孝\n\n（元武宗追谥）"
 shihao_wuzong_yuan_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 刚强直理，威强睿德，谥曰曲律汗、仁惠宣孝"
 shihao_renzong_yuan_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 慈民爱物，体元立极，谥曰普颜笃汗、圣文钦孝"
 shihao_yingzong_yuan_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 德华茂著，明识大略，谥曰格坚汗、睿圣文孝"
 shihao_xianzong_yuan_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 圣德昭临，受禄于天，谥曰光圣仁孝\n\n（元泰定帝追谥，元文宗时剥夺）"
 shihao_wenzong_yuan_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 愍民惠礼，帝德运广，谥曰札牙笃汗、圣明元孝"
 shihao_mingzong_yuan_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 照临四方，任贤致远，谥曰忽都笃汗、翼献景孝"
 shihao_ningzong_yuan_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 裕以安民，渊衷湛一，谥曰冲圣嗣孝"
 shihao_huizong_yuan_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 慈仁和民，智能翼君，尊号“乌哈笃汗”，谥曰顺\n\n（明太祖追谥）"
 
 
 
 
 hongnonghuaiwang: "弘农怀王"
 hongnonghuaiwang_desc: "被董卓废黜，次年被害"
 
 anlesigong: "安乐思公"
 
 shaolingligong: "邵陵厉公"
 shaolingligong_desc: "司马师废曹芳为齐王。西晋建立后，册封邵陵县公。死后谥号“厉”"
 
 gaoguixianggong: "废"
 gaoguixianggong_desc: "高贵乡公才同陈思，武类太祖。哀哉，哀哉。"
 
 yuandichenliuwang: "元"
 yuandichenliuwang_desc: "降封为陈留王。年五十八，大安元年崩，谥曰元皇帝。\n\n奂知鼎命已移，垂拱仰成，永终天禄，甘于亡灭，孝献之流尔。"
 
 haixigong: "海西公"
 haixigong_desc: "大司马桓温所废，降封东海王，后又降封海西县公"
 
 yulinwang: "废"               #郁林王萧昭业
 yulinwang_desc: "遇害后，萧鸾以皇太后名义下诏，追贬萧昭业为郁陵王。\n\n十愆有一，无国不失。郁林负荷，弃礼亡律。"
 
 hailinggongwang: "废"            #海陵王萧昭文
 hailinggongwang_desc: "萧鸾拥立的傀儡，后降封海陵王\n\n穆穆海陵，因亡代兴。不先不后，遭命是膺。"
 
 donghunhou: "废"              #东昏侯萧宝卷
 donghunhou_desc: "萧衍掌权后，褫夺萧宝卷帝号，贬为涪陵王，后依汉海昏侯故事再贬为东昏侯\n\n东昏慢道，匹癸方辛。乃隳典则，乃弃彝伦，玩习兵火，终用焚身。"
 
 huaiyinwang: "淮阴王"
 huaiyinwang_desc: "侯景废萧纲，立萧栋为帝。后接受禅让，降封萧栋为淮阴王"
 
 jiananwang: "建安王"
 jiananwang_desc: "陈霸先废黜，降为建安王，萧庄追谥“闵”！"
 
 jiangyinwang: "敬"          #萧方智
 jiangyinwang_desc: "敬帝遭家不造，绍兹屯运，征伐有所自出，政刑不由于己，时无伊、霍之辅，焉得不为高让欤？"
 
 yingyangwang: "少"
 yingyangwang_desc: "被权臣徐羡之、谢晦等人所废，降为营阳王。\n\n社稷将坠，岂可复嗣守洪业，君临万邦。今废为营阳王，一依汉昌邑、晋海西故事。 "
 
 yuanxiong: "伪"
 yuanxiong_desc: "元凶邵“穷弑极逆，开辟未闻”"
 
 liuziye: "废"
 liuziye_desc: "宋前废帝詈辱祖考，行秽禽兽。武王数殷纣之衅，不能挂其万一。"
 
 liuyu: "废"
 liuyu_desc: "宋后废帝暴戾酷虐，藏玺怀绂，鱼服忘反，霣社残宗，污宫潴庙。"
 
 shundiruyinwang: "顺"        #宋顺帝刘准
 shundiruyinwang_desc: "齐王践阼，封为汝阴王，待以不臣之礼。后殂于丹阳宫，时年十三。谥曰顺帝。"
 
 linhaiwang: "废"                  #陈临海王
 linhaiwang_desc: "临海懦弱，有同于帝挚，文后虽欲不鉴殷道，盖亦其可得邪？"
 
 chenshubao: "长城炀公"
 chenshubao_desc: "丽宇芳林对高阁，新装艳质本倾城。\n映户凝娇乍不进，出帷含态笑相迎。\n妖姬脸似花含露，玉树流光照后庭。"
 
 beixianghou: "少"#汉少帝刘懿
 beixianghou_desc: "汉顺帝继位后不承认刘懿的正统性，以诸侯之礼下葬。因此也有史家不将刘懿计入东汉皇帝，称济北王。"
 

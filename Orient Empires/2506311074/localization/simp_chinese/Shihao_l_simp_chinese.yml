 xiangyingong: "湘阴公"
 
 wangyan: "后主"                     #后主王衍
 
 mengchang: "后主"                 #后主孟昶
 
 fuyihou: "负义侯"
 fuyihou_desc: "降辽后被封为负义侯"
 
 nanhanhouzhu: "后主"            #南汉后主
 
 sunliang: "会稽王"
 
 sunhao: "归命侯"
 sunhao_desc: "皓穷凶极恶，卒陨其业，非不幸也。"
 
 weiminghou: "违命侯"                                                        #李煜
 weiminghou_desc: "无言独上西楼，月如钩。 寂寞梧桐深院锁清秋。剪不断，理还乱，是离愁。别是一般滋味在心头。"
 
 yuanyitaizi: "元懿太子"
 
 songgongdi: "恭"
 songgongdi_desc: "降元后降封瀛国公。宋端宗上尊号孝恭懿圣皇帝。死后元朝上谥号恭皇帝，韩林儿上谥号法宗章文敬武睿孝皇帝。"
 
 
 xiaoyanyan: "圣神宣献皇后"
 xiaoyanyan_desc: "初谥圣神宣献皇后，后辽兴宗更谥为睿智皇后"
 
 hailingwang: "废"
 hailingwang_desc: "被弑后降封为海陵郡王，谥号为炀。后又废为海陵庶人。\n\n万里车书一混同，江南岂有别疆封？提兵百万西湖上，立马吴山第一峰！——海陵王完颜亮"
 
 weishaowang: "废"
 weishaowang_desc: "被弑后降封为东海郡侯，后又追复为卫王，谥曰绍\n\n我谓中原皇帝是天上人做，此等庸懦亦为之耶？！——孛儿只斤·铁木真"
 
 

 yueliwang: "越厉王"
 yueliwang_desc: "苻坚即位，称大秦天王。废苻生为越王，死后谥“厉”"
 
 daiwang: "代王"
 
 nananyinwang: "废"
 nananyinwang_desc: "南安隐王"
 
 yuanqin: "废"
 yuanqin_desc: "元钦谋宇文泰，事泄被废"
 
 gaoyin: "济南闵悼王"
 gaoyin_desc: "常山王高演兵变篡位，娄太后下旨废高殷为济南王"
 
 wuchoutianzi: "无愁天子"
 wuchoutianzi_desc: "巧笑知堪敌万几，倾城最在著戎衣。\n晋阳已陷休回顾，更请君王猎一围。"
 
 wenguogong: "温国公"
 
 zhuyougui: "伪"        #朱友珪
 zhuyougui_desc: "弑父自立，行道无度，臣民不附"
 

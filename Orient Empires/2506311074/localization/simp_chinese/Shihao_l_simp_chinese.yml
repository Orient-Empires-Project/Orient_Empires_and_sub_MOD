 shihao_guangsheng_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 功格上下，扬善赋简，谥曰光圣\n\n李元昊追谥"
 shihao_zhaoying_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 昭德有劳，明识大略，谥曰昭英"
 shihao_kangjing_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 安乐抚民，柔德安众，谥曰康靖"
 shihao_shengwen_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 虚己从谏，经纬天地，谥曰圣文"
 shihao_shengde_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 敬宾厚礼，贵而好礼，谥曰圣德"
 shihao_zhaojian_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 圣闻周达，至德临下，谥曰昭简"
 shihao_jingmu_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 令善典法，布德执义，谥曰敬穆"
 shihao_yingwen_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 出类拔萃，慈惠爱民，谥曰英文"
 
 shihao_liezu_yuan: "神元"
 shihao_taizu_yuan: "成吉思汗、法天启运圣武"
 shihao_ruizong_yuan: "也可那颜、仁圣景襄"
 shihao_taizong_yuan: "木亦坚汗、英文"

 shihao_mengzhixiang_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 业成无兢，五宗安之，谥曰文武圣德英烈明孝"                              #孟知祥
 shihao_xiaode_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 博施被物，贵而好礼，谥曰孝德"
 shihao_xuzhigao_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 能绍前业，经邦定誉，谥曰光文肃武孝高皇帝"                                     #徐知诰
 shihao_nantanglijing_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 浚达有德，善政养民，谥曰明道崇德文宣孝"
 shihao_shengwu_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 睿智天纵，威强恢远，谥曰圣武"
 
 shihao_tianhuangda: "天皇大"
 shihao_nanhanzhongzong: "文武光圣明孝"#南汉中宗刘晟
 shihao_wuzetian: "则天大圣"
 shihao_wulie: "武烈"
 shihao_da: "大"
 
 shihao_tianhuangda_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 靖民则法，则天法尧，谥曰天皇大"
 shihao_nanhanzhongzong_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 通达先知，照临四方，谥曰文武光圣明孝"             #南汉中宗刘晟
 shihao_wuzetian_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 德象天地，行道化民，谥曰则天大圣\n\n谥曰则天大圣皇后。唐隆元年（710），改为天后；景云元年（710），改为大圣天后；延和元年（712），改为天后圣帝，未几，改为圣后；开元四年（716），改为则天皇后；天宝八载（749），加谥则天顺圣皇后。"                                    #武则天
 shihao_wulie_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 克定祸乱，戎业有光，谥曰武烈"                                                                        #孙坚
 shihao_da_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 则天法尧，德象天地，谥曰大"
 
 shihao_zhaoxiaowu: "昭孝武"
 shihao_minguowangxi: "睿文广武明圣元德隆道大孝"
 shihao_minguowangchang: "圣神英睿文明广武应道大弘孝"
 
 shihao_zhaoxiaowu_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 德业升闻，践修世德，谥曰昭孝武"
 shihao_minguowangxi_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 致志大图，明照旁周，谥曰睿文广武明圣元德隆道大孝"
 shihao_minguowangchang_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] 能安兆民，务德不争，谥曰圣神英睿文明广武应道大弘孝"
 

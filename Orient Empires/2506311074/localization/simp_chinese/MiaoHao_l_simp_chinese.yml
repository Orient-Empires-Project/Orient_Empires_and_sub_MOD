 death_miaohao.000.taizu: "先帝功劭德崇且创业垂统，谥曰高！"
 death_miaohao.000.shizu: "先帝功劭德崇且光兴大业，谥曰元！"
 
 
 ### 议定庙号 ###
 zhuifeng_decision: "追封先祖"
 death_miaohao.001.title: "议定庙号"
 death_miaohao.001.desc: "臣闻德教重於日新，《礼》经不自天降。故历代之有损有益，随时之可止可行。恭惟朝廷之重，宗庙为先，事系承祧。尊祖奉先，议定庙号。"
 death_miaohao.002.title: "追封庙号"
 death_miaohao.002.desc: "天子七庙，敬奉先考入庙受祀！"
 death_miaohao.001.taizu: "先帝功劭德崇且创业垂统，曰太，庙号太祖！"
 death_miaohao.001.shizu: "先帝功劭德崇且光兴大业，曰世，庙号世祖！"
 death_miaohao.001.a: "先帝功劭德崇且好和不争，曰安，庙号安宗！"
 death_miaohao.001.b: "先帝功劭德崇然早孤短折，日哀，庙号哀宗！"
 death_miaohao.001.c: "先帝功劭德崇且礼乐明具，曰成，庙号成宗！"
 death_miaohao.001.d: "先帝功劭德崇且能修其官，曰崇，庙号崇宗！"
 death_miaohao.001.e: "先帝功劭德崇且至诚无息，曰纯，庙号纯宗！"
 death_miaohao.001.f: "先帝功劭德崇且景物四方，曰代，庙号代宗！"
 death_miaohao.001.g: "先帝功劭德崇且爱民好治，曰戴，庙号戴宗！"
 death_miaohao.001.h: "先帝功劭德崇且以德化民，曰道，庙号道宗！"
 death_miaohao.001.i: "先帝功劭德崇且贵而好礼，曰德，庙号德宗！"
 death_miaohao.001.j: "先帝功劭德崇且安民大虑，曰定，庙号定宗！"
 death_miaohao.001.k: "先帝功劭德崇且宽裕有容，曰度，庙号度宗！"
 death_miaohao.001.l: "先帝功劭德崇且圣修式化，曰端，庙号端宗！"
 death_miaohao.001.m: "先帝功劭德崇且功德盛大，曰高，庙号高宗！"
 death_miaohao.001.n: "先帝功劭德崇且勤恤民隐，曰恭，庙号恭宗！"
 death_miaohao.001.o: "先帝功劭德崇且能绍前业，曰光，庙号光宗！"
 death_miaohao.001.p: "先帝功劭德崇且慈仁短折，曰怀，庙号怀宗！"
 death_miaohao.001.q: "先帝功劭德崇且武定四方，曰桓，庙号桓宗！"
 death_miaohao.001.r: "先帝功劭德崇且元德充美，曰徽，庙号徽宗！"
 death_miaohao.001.s: "先帝功劭德崇且泽及万世，曰惠，庙号惠宗！"
 death_miaohao.001.t: "先帝功劭德崇且正直无邪，曰简，庙号简宗！"
 death_miaohao.001.u: "先帝功劭德崇且耆意大虑，曰景，庙号景宗！"
 death_miaohao.001.v: "先帝功劭德崇且众方克就，曰敬，庙号敬宗！"
 death_miaohao.001.w: "先帝功劭德崇且宽乐令终，曰靖，庙号靖宗！"
 death_miaohao.001.x: "先帝功劭德崇且渊源流通，曰康，庙号康宗！"
 death_miaohao.001.y: "先帝功劭德崇且纳民轨物，曰礼，庙号礼宗！"
 death_miaohao.001.z: "先帝功劭德崇且政平刑肃，曰理，庙号理宗！"
 death_miaohao.001.a1: "先帝功劭德崇且光有大功，曰烈，庙号烈宗！"
 death_miaohao.001.b1: "先帝功劭德崇且保民耆艾，曰明，庙号明宗！"
 death_miaohao.001.c1: "先帝功劭德崇且圣敬有仪，曰穆，庙号穆宗！"
 death_miaohao.001.d1: "先帝功劭德崇且端重自毖，曰宁，庙号宁宗！"
 death_miaohao.001.e1: "先帝功劭德崇且神明俨翼，曰钦，庙号钦宗！"
 death_miaohao.001.f1: "先帝功劭德崇且慈民爱物，曰仁，庙号仁宗！"
 death_miaohao.001.g1: "先帝功劭德崇且深思远虑，曰睿，庙号睿宗！"
 death_miaohao.001.h1: "先帝功劭德崇且疏远继位，曰绍，庙号绍宗！"
 death_miaohao.001.i1: "先帝功劭德崇且治民无为，曰神，庙号神宗！"
 death_miaohao.001.j1: "先帝功劭德崇且备道全美，曰圣，庙号圣宗！"
 death_miaohao.001.k1: "先帝功劭德崇且承命不迁，曰世，庙号世宗！"

minister_grand_chancellor_desc: "宰相可以：\n$BULLET$使用[GetDecision('favored_movement_consults_heaven_decision').GetName|V][decision|E]\n$BULLET$通过[GetDecision('tgp_minister_recruit_courtiers_decision').GetName|V][decision|E]召唤任意类型的[courtier|E]\n$BULLET$发起[GetGreatProjectType('minister_compel_religious_uniformity').GetName|V][great_project|E]\n$BULLET$以更低的花费使用特殊#V $influence_meritorious_career_interaction$#![interaction|E]选项#!"
minister_censor_desc: "御史大夫可以：\n$BULLET$使用#V $censor_find_secrets_interaction$#![interaction|E]在[vassal|E]的[courts|E]查找[secrets|E]或获得[hooks|E]\n$BULLET$[blackmail|E]会触发#V “$catalyst_minister_blackmailed$”#![dynastic_cycle_catalyst|E]\n$BULLET$使用特殊#V $influence_meritorious_career_interaction$#![interaction|E]选项#!"
minister_grand_marshal_desc: "枢密使可以：\n$BULLET$发起#V 开边#![great_project|E]\n$BULLET$发起[GetGreatProjectType('construct_great_barracks').GetName|V][great_project|E]\n$BULLET$在[GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName]和[GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability_conquest').GetName][dynastic_cycle_eras_short|E]使用#V $CHINA_SEIZE_COUNTY_CB_NAME$#!和#V $CHINA_SEIZE_DUCHY_CB_NAME$#![casus_bellis|E]\n$BULLET$使用特殊#V $influence_meritorious_career_interaction$#![interaction|E]选项#!"
minister_of_personnel_desc: "吏部尚书可以：\n$BULLET$无视[GetLawGroup('celestial_retirement_law').GetName][law|E]使用#V $force_governor_removal_interaction$#![interaction|E]开除[governors|E]\n$BULLET$使用[GetDecision('tgp_minister_recruit_courtiers_decision').GetName|V][decision|E]邀请任意类型的[courtier|E]\n$BULLET$强制对方接受#V $offer_courtier_interaction$#!和#V $demand_courtier_interaction$#![interactions|E]\n$BULLET$以更低的花费使用特殊#V $influence_meritorious_career_interaction$#![interaction|E]选项#!"
minister_of_revenue_desc: "户部尚书可以：\n$BULLET$帮助#V $celestial_request_treasury_interaction$#!的[vassals|E]\n$BULLET$使用[GetDecision('tgp_suggest_budget_change_decision').GetName|V][decision|E]\n$BULLET$发起[GetGreatProjectType('minister_project_conduct_census').GetName|V][great_project|E]\n$BULLET$使用#V $pay_treasury_debt_interaction$#![interaction|E]偿清[civilian_governors|E]的[treasury_debt|E]会触发#V “$catalyst_cleared_treasury_debt$”#![dynastic_cycle_catalyst|E]\n$BULLET$使用特殊#V $influence_meritorious_career_interaction$#![interaction|E]选项#!"
minister_of_rites_desc: "礼部尚书可以：\n$BULLET$发起[GetGreatProjectType('minister_project_culture').GetName|V][great_project|E]\n$BULLET$发起[GetGreatProjectType('minister_compel_religious_uniformity').GetName|V][great_project|E]\n$BULLET$协助[vassals|E]举行[examinations|E]\n$BULLET$对[faith_hostile|E]或[faith_evil|E][faiths|E]的[characters|E]#V $demand_conversion_minister_rites_interaction$#!\n$BULLET$使用特殊#V $influence_meritorious_career_interaction$#![interaction|E]选项#!"
minister_of_war_desc: "兵部尚书可以：\n$BULLET$向在[war|E]中#V $celestial_request_military_aid_interaction$#!的[vassals|E]派出援兵\n$BULLET$命令[military_governors|E]加入其他[governors|E]的[wars|E]\n$BULLET$发起[GetGreatProjectType('minister_project_train_troops').GetName|V][great_project|E]\n$BULLET$使用#V $pay_treasury_debt_interaction$#![interaction|E]为[military_governors|E]偿清[treasury_debt|E]，并处罚#V “$catalyst_cleared_treasury_debt$”#![dynastic_cycle_catalyst|E]\n$BULLET$使用特殊#V $influence_meritorious_career_interaction$#![interaction|E]选项#!"
minister_of_justice_desc: "刑部尚书可以：\n$BULLET$发起[GetGreatProjectType('minister_project_establish_control').GetName|V][great_project|E]\n$BULLET$对[vassals|E]和[courtiers|E]使用#V $imprison_interaction$#![interaction|E]，对方无法拒绝\n$BULLET$对犯下[crimes|E]的[characters|E]使用#V $pardon_interaction$#![interaction|E]\n$BULLET$使用$censor_find_secrets_interaction$[interaction|E]在[vassal|E][courts|E]查找[secrets|E]，并[imprison|E]或赦免已知的[criminals|E]\n$BULLET$曝光[secrets|E]会触发“$catalyst_minister_exposed_secret$”[dynastic_cycle_catalyst|E]\n$BULLET$使用特殊#V $influence_meritorious_career_interaction$#![interaction|E]选项#!"
minister_of_works_desc: "工部尚书可以：\n$BULLET$发起[GetGreatProjectType('minister_project_development').GetName|V][great_project|E]\n$BULLET$发起[GetGreatProjectType('grand_canals').GetName|V][great_project|E]\n$BULLET$发起[GetGreatProjectType('great_wall').GetName|V][great_project|E]\n$BULLET$可以在[realm|E]内建造[buildings|E]和[holdings|E]\n$BULLET$[GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName][dynastic_cycle_era_short|E]中可以在[son_of_heaven|E]的[tributaries|E]领地内建造[buildings|E]和[holdings|E]\n$BULLET$使用特殊#V $influence_meritorious_career_interaction$#![interaction|E]选项#!"
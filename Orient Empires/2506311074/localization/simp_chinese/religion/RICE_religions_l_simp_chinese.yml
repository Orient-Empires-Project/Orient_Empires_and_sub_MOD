 rice_doctrine_west_iranian_name: "核心神位"
 rice_doctrine_west_iranian_desc: "我们地虔诚应侧重于重要的神祇，尽管我们对祂们的性质、传说、确切身份可能会有不同的看法，但正确的行为，在瞻仰祂们时是最重要的。"
 rice_west_iranian_yazidi_doctrine_name: "七天使"
 rice_west_iranian_yazidi_doctrine_desc: "#italic 永恒之神#!创造了宇宙和祂的七位天使。居于首位的是孔雀天使，由神授予了管理世界的权柄。"
 doctrine_parameter_rice_yazidi_decision_unlocked_active: "解锁[GetActivityType('activity_RICE_yazidi_tiwaf').GetName][activity|E]"
 doctrine_parameter_rice_yazidi_decision_2_unlocked_active: "解锁[GetActivityType('activity_RICE_yazidi_tawus_geran').GetName][activity|E]"
 rice_west_iranian_yarsani_doctrine_name: "七化身"
 rice_west_iranian_yarsani_doctrine_desc: "每个纪元中，真主都会以七种化身出现，而#italic 哈夫坦#!乃此纪元化身。"
 doctrine_parameter_rice_yarsani_decision_unlocked_active: "解锁[GetActivityType('activity_RICE_yazidi_yarsani_jam').GetName][activity|E]"
 rice_west_iranian_kurdish_pagan_doctrine_name: "密特拉秘仪"
 rice_west_iranian_kurdish_pagan_doctrine_desc: "有许多神祇必须受到崇拜，但真理之神、正义之神和太阳神密特拉是最重要的神祇之一，因为祂是在世界诞生之初献祭一头公牛而创造了世界的神祇。"
 doctrine_parameter_rice_kurdish_pagan_decision_unlocked_active: "解锁[GetActivityType('activity_RICE_yazidi_bull_sacrifice').GetName][activity|E]"
 special_doctrine_is_west_iranian_faith_name: "西伊朗正教"
 is_west_iranian_faith_name: "$special_doctrine_is_west_iranian_faith_name$"
 special_doctrine_is_west_iranian_faith_desc: "由于与世隔绝且地形崎岖，美索不达米亚北部、伊朗西部和安纳托利亚东部的高地和山谷是许多异教的发源地。虽然这些教派的宗教起源不同，但它们有许多共同的做法、信仰和思想。"
 doctrine_parameter_hostility_override_special_doctrine_is_west_iranian_faith: "具有$special_doctrine_is_west_iranian_faith_name$[doctrine|E]的非东方[faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]而非$hostility_hostile_tooltippable$或$hostility_evil_tooltippable$"
 special_doctrine_rice_doctrine_horse_sacrifice_name: "马祭"
 rice_doctrine_horse_sacrifice_name: "$special_doctrine_rice_doctrine_horse_sacrifice_name$"
 special_doctrine_rice_doctrine_horse_sacrifice_desc: "马是这世界上最神圣的动物！我们尊崇马儿，将其献祭给上天。"
 doctrine_parameter_rice_unlock_horse_sacrifice: "解锁[GetActivityType('activity_RICE_mordvin_horse_sacrifice').GetName][activity|E]"
 
 guanche_pagan_desc: "阿查曼，永恒的天神，创造了土地和水，火和空气，所有的生物都来自他的存在。阿查曼住在高处，有时会下到山顶上，思考他的创造物。根据传说，瓜约塔绑架了太阳神马格克，并将其困在泰德火山中，使世界陷入黑暗。人类向阿查曼祈祷，阿查曼救了马格克，却把邪恶的瓜约塔关进了泰德火山，瓜约塔将永远居住在那里。瓜约塔继续通过他的后代提比塞纳来折磨人类，提比塞纳是拥有大野狗身体的恶魔，长着红色的眼睛，身上覆盖着黑色长毛。提比塞纳和他的父亲瓜约塔一样住在深山的洞穴里；他们会在晚上出来攻击人类或牲畜。"

 east_bantu_religion_adherent_plural: "东班图原始宗教信徒"
 east_bantu_religion_desc: "班图人的精神信仰有很多相似之处，比如对祖先崇拜的重视。东班图人尽管与基督教和伊斯兰教社会有接触，但仍然保留着他们的传统。"

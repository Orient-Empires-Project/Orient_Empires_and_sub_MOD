 culture_parameter_unlock_maa_china_east_ms: "可以招募[GetMaA('china_east_ms').GetName][men_at_arms|E]"
 culture_parameter_unlock_maa_china_south_wd: "可以招募[GetMaA('china_south_wd').GetName][men_at_arms|E]"
 culture_parameter_multiple_claim_wars: "可以在单场战争中为自己索取多个[claims|E]"
 
 innovation_world_cathay: "契丹军制"
 innovation_world_cathay_desc: "太宗选天下精甲三十万为皮室军。初，太祖以行营为宫，选诸部豪健千馀人，置为腹心部……则皮室军自太祖时已有，即腹心部是也，太宗增多至三十万耳。"
 
 innovation_battleships: "艨艟斗舰"
 innovation_battleships_desc: "千寻铁锁沉江底，一片降幡出石头。"
 
 innovation_outrigger_boats: "独木舟"
 
 
 innovation_target_region_liangjing: "两京禁卫"
 innovation_target_region_liangjing_desc: "暂辍清斋出太常，空携诗卷赴甘棠。\n府公既有朝中旧，司马应容酒后狂。\n案牍来时唯署字，风烟入兴便成章。\n两京大道多游客，每遇词人战一场。"
 
 
 innovation_china_east: "吴钩"
 innovation_china_east_desc: "汉鼎不烹曹操肉，吴钩空断伍员头。"
 innovation_china_north: "幽州良驹"
 innovation_china_north_desc: "文法奸酋引骑兵，飞随银鹘弓刀满。"
 innovation_world_asia_korea: "高丽猎手"
 innovation_world_asia_korea_desc: "高丽其地，山广林丰；其人擅制围猎之器，尤擅制弓，盖以为军用，多良弓好手。"
 innovation_china_south: "西蜀连弩"
 innovation_china_south_desc: "昔闻天兵入西蜀，鞞鼓乱挝裂岩谷。"
 innovation_china_centre: "中原军制"
 innovation_china_centre_desc: "醉卧沙场君莫笑，古来征战几人回。"
 innovation_china_west: "陌刀"
 innovation_china_west_desc: "霜矛雪甲寒如水，候卒何由知首尾。"
 
 unlock_kingdom_bureaucrat: "解锁王国级流官制"
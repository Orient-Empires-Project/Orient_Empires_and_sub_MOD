l_simp_chinese:
 
 shogunate_nickname_desc_true_imperial_post: "「[CHARACTER.GetNicknameNoTooltip]」是朝廷官位的名称。[CHARACTER.GetFirstNameNoTooltip]担任正式的官职，并被旁人以官位相称。"
 shogunate_nickname_desc_false_imperial_post: "$shogunate_nickname_desc_remark$「[CHARACTER.GetNicknameNoTooltip]」是朝廷官位的名称。然而，[CHARACTER.GetFirstNameNoTooltip]并没有正式的官职，[CHARACTER.GetNicknameNoTooltip]只是自称。在战国时代经常发生自称官位的情况，这被称为武家官位（ぶけかんい）。"
 shogunate_nickname_desc_azuma_hyakkan: "$shogunate_nickname_desc_remark$[CHARACTER.GetFirstNameNoTooltip]以朝廷官职的风格自称为「[CHARACTER.GetNicknameNoTooltip]」。然而，「[CHARACTER.GetNicknameNoTooltip]」并不是正式的官位名称，而是关东地区模仿官职所创造的官位名称。这被称为东百官（あずまひゃっかん）或武家百官（ぶけひゃっかん）。"
 shogunate_nickname_desc_nickname: "$shogunate_nickname_desc_remark$[CHARACTER.GetFirstNameNoTooltip]以「[CHARACTER.GetNicknameNoTooltip]」作为通称。在日本中世时代，人们习惯避免使用本名（讳）而使用通称来作为称呼。这个通称被称为假名（けみょう）或辈行名（はいこうめい）。"
 shogunate_nickname_desc_catholic_name: "$shogunate_nickname_desc_remark$[CHARACTER.GetFirstNameNoTooltip]以虔诚的基督徒身份被知晓，以洗礼名「[CHARACTER.GetNicknameNoTooltip]」自称。"
 shogunate_nickname_desc_special: "$shogunate_nickname_desc_remark$[CHARACTER.GetFirstNameNoTooltip]被旁人称为「[CHARACTER.GetNicknameNoTooltip]」。这个称呼是特殊的，其他人不可以轻易使用。"
 
 shogunate_nickname_desc_remark: "[SelectLocalization(CHARACTER.MakeScope.Var('shogunate_fictional_nickname').Char.IsValid, 'shogunate_nickname_desc_fictional', 'shogunate_nickname_desc_historical')]"
 shogunate_nickname_desc_historical: "#P Historical nickname#!\n\n"
 shogunate_nickname_desc_fictional: "#N Fictional nickname#!\n\n"
 
 

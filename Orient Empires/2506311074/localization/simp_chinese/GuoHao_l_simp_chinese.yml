 guohao.001.title: "拟定国号"
 guohao.001.desc: "惟今圣皇，振奋乾罡；\n八荒咸服，四维更张；\n功盖五帝，德被三皇；\n立号天下，明法肃庄；\n应天保民，正朔是匡；\n以歌以扬，伏惟尚飨！"
 guohao_nickname.a: "定国号为……"
 
 guohao.002.title: "拟定封号"
 guohao.002.desc: "自黄帝至舜、禹，皆同姓而异其国号，以章明德。"
 east_title.0004.t: "拟定国号"
 east_title.0004.desc: "惟今圣皇，振奋乾罡；\n八荒咸服，四维更张；\n功盖五帝，德被三皇；\n立号天下，明法肃庄；\n应天保民，正朔是匡；\n以歌以扬，伏惟尚飨！"

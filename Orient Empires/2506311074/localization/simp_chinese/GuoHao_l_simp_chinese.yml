 guohao_custom: "自定义"
 guohao_xia: "今上肇兴有夏，德闻禹迹，号夏"
 guohao_shang: "今上交通天命，业比成汤，号商"
 guohao_zhou: "今上仁德昭彰，典兴礼乐，号周"
 guohao_qin: "今上肃清六合，总齐八荒，号秦"
 guohao_han: "今上拓土攘夷，复立衣冠，号汉"
 guohao_sui: "今上融通夷夏，柔服迩远，号隋"
 guohao_tang: "今上开元神武，威震寰宇，号唐"
 guohao_song: "今上再定江山，宽仁雅韵，号宋"
 guohao_ming: "今上匡世救民，日月重开，号明"
